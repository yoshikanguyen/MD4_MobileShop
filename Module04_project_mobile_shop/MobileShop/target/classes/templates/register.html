<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký | Mobile SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<section class="login-card">
    <div class="login-logo"><span class="logo-badge">▣</span> Mobile <b>SHOP</b></div>
    <h1>Đăng ký Admin</h1>
    <p class="muted" style="text-align:center">Tạo tài khoản quản lý cửa hàng</p>
    <p th:if="${registerError}" class="form-error" th:text="${registerError}"></p>
    <form method="post" th:action="@{/register}" th:object="${request}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">Username</label><input id="username" th:field="*{username}" minlength="3" maxlength="60"
                                                     pattern="[A-Za-z0-9_]{3,60}" required autocomplete="username">
        <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="form-error"></p>
        <label for="password">Mật khẩu</label><input id="password" type="password" name="password" minlength="6"
                                                     required autocomplete="new-password">
        <p class="hint">Ít nhất 6 ký tự gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</p>
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></p>
        <label for="confirmPassword">Nhập lại mật khẩu</label><input id="confirmPassword" type="password"
                                                                     name="confirmPassword" required
                                                                     autocomplete="new-password">
        <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="form-error"></p>
        <button type="submit" class="primary full" style="margin-top:22px">Đăng ký</button>
    </form>
    <p class="login-footnote"><a th:href="@{/login}">Quay lại trang đăng nhập</a></p>
    <footer>© 2026 · Mobile SHOP</footer>
</section>
</body>
</html>
