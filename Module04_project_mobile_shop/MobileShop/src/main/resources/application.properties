spring.application.name=MobileShop
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/mobile_shop?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed-demo-data=${SEED_DEMO_DATA:true}
server.error.include-stacktrace=never

file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Local demo allows admin sign-up; disable in a publicly accessible deployment.
app.registration.enabled=${ALLOW_PUBLIC_ADMIN_REGISTRATION:true}
